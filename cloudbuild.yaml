steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - remote-compute.Dockerfile
      - --build-arg
      - GIT_COMMIT=${_GIT_COMMIT}
      - -t
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
# Fetching the Mathlib cache and building the Lean executable exceeds the
# ten-minute default build timeout.
timeout: 5400s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

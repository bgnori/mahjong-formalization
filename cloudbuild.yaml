steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - remote-compute.Dockerfile
      - --build-arg
      - BASE_IMAGE=${_BASE_IMAGE}
      - --build-arg
      - DEPENDENCY_HASH=${_DEPENDENCY_HASH}
      - --build-arg
      - GIT_COMMIT=${_GIT_COMMIT}
      - -t
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
# Building the project executables can exceed the ten-minute default timeout.
timeout: 5400s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
